<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1c3a2f">
<title>デモ動画 · STNet IDEA STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c3a2f;--bg2:#234638;--ink:#f4f6f1;--sub:#b9c8bf;--accent:#e6f59a;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"BIZ UDGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:0 auto;padding:28px 16px 40px}
.kicker{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:14px;letter-spacing:.08em}
.kicker i{display:inline-block;width:26px;height:26px;border-radius:7px;background:#2e5a47}
h1{font-size:clamp(22px,3.4vw,34px);line-height:1.35;margin:10px 0 6px;font-weight:700}
h1 span{color:var(--accent)}
.meta{color:var(--sub);font-size:14px;margin:0 0 18px}
.frame{background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9}
video{display:block;width:100%;height:100%;background:#000}
.notes{margin:14px 0 0;padding:0;list-style:none;color:var(--sub);font-size:14px}
.notes li{padding:2px 0}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}
.links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--bg2);padding:9px 14px;border-radius:999px;font-size:14px}
.links a:hover{border-color:var(--accent)}
.err{display:none;margin:12px 0 0;color:#ffd6a0;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="kicker"><i aria-hidden="true"></i>STNet IDEA STUDIO</div>
  <h1>新規事業ワークショップで、<span>できること</span></h1>
  <p class="meta">デモ動画（1分48秒・音声なし）</p>
  <div class="frame">
    <video id="v" controls playsinline preload="metadata" poster="demo-poster.jpg">
      <source src="demo.mp4" type="video/mp4">
      この画面では動画を再生できません。下の「動画ファイルだけを開く」からお試しください。
    </video>
  </div>
  <p class="err" id="err">動画を読み込めませんでした。社内のネットワークで止められている可能性があります。下の「動画ファイルだけを開く」もお試しください。</p>
  <ul class="notes">
    <li>音声はありません。画面下の字幕で流れを説明しています。</li>
    <li>画面の入力とAIの応答は、デモ用の例です。</li>
  </ul>
  <div class="links">
    <a href="./">ワークの画面を開く</a>
    <a href="./check.html">接続を確かめる</a>
    <a href="./demo.mp4">動画ファイルだけを開く</a>
  </div>
</main>
<script>
document.getElementById('v').addEventListener('error',function(){document.getElementById('err').style.display='block'},true);
</script>
</body>
</html>
